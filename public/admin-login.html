<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Telcel Store</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #002855, #004d99); }
    .login-card { background: white; padding: 2.5rem; border-radius: 20px; width: min(400px, 92%); box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
    .login-card h1 { text-align: center; margin-bottom: 0.25rem; color: var(--telcel-blue); }
    .login-card .sub { text-align: center; color: var(--muted); margin-bottom: 1.75rem; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Panel de control</h1>
    <p class="sub">Telcel Store Admin</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Correo</label>
        <input type="email" id="email" required value="admin@telcel.store" />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Iniciar sesión</button>
    </form>
    <p id="error" style="color:var(--danger);margin-top:1rem;text-align:center;display:none"></p>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('error');
      btn.disabled = true;
      btn.textContent = 'Entrando...';
      err.style.display = 'none';
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error');
        window.location.href = '/admin';
      } catch (ex) {
        err.textContent = ex.message;
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Iniciar sesión';
      }
    });
  </script>
</body>
</html>
